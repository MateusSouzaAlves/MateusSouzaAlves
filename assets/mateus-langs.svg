<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" aria-labelledby="title desc"><title id="title">Principais linguagens de Mateus Souza</title><desc id="desc">Linguagem principal de 25 repositórios públicos: Java 52%, TypeScript 12%, JavaScript 8% e outras 28%. Dois repositórios sem linguagem identificada não entram no cálculo.</desc>
  <defs><style><![CDATA[text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes shineX{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}.row{opacity:0;animation:fadeUp .5s ease forwards}.sh{animation:shineX 4s ease-in-out 2.2s infinite}@media(prefers-reduced-motion:reduce){.row,.sh{animation:none!important;opacity:1}}]]></style><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#3ddc84"/></linearGradient><linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="card"><rect x="1" y="1" width="418" height="280" rx="14"/></clipPath><clipPath id="stack"><rect x="20" y="58" width="380" height="11" rx="5.5"/></clipPath></defs>
  <rect x="1" y="1" width="418" height="280" rx="14" fill="#0b1026" stroke="url(#tg)" stroke-width="1.5"/><text x="20" y="34" font-size="16" font-weight="bold" fill="#c4b5fd">📊 Principais Linguagens</text>
  <g clip-path="url(#stack)"><rect x="20" y="58" width="197.6" height="11" fill="#f59e0b"><animate attributeName="width" from="0" to="197.6" dur="1.2s" begin=".35s" fill="freeze"/></rect><rect x="217.6" y="58" width="45.6" height="11" fill="#38bdf8"/><rect x="263.2" y="58" width="30.4" height="11" fill="#fde047"/><rect x="293.6" y="58" width="106.4" height="11" fill="#c084fc"/></g>
