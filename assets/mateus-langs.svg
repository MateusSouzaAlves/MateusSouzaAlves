  <g class="row" style="animation-delay:1.5s"><circle cx="26" cy="175" r="5" fill="#fde047"/><text x="40" y="180" font-size="13" fill="#e2e8f0" font-weight="bold">JavaScript</text><text x="396" y="180" text-anchor="end" font-size="13" fill="#fde047" font-weight="bold">8%</text><rect x="40" y="188" width="268" height="9" rx="4.5" fill="#171333"/><rect x="40" y="188" width="21.4" height="9" rx="4.5" fill="#fde047"><animate attributeName="width" from="0" to="21.4" dur="1.1s" begin="1.65s" fill="freeze"/></rect></g>
  <g class="row" style="animation-delay:1.85s"><circle cx="26" cy="217" r="5" fill="#c084fc"/><text x="40" y="222" font-size="13" fill="#e2e8f0" font-weight="bold">Outras linguagens</text><text x="396" y="222" text-anchor="end" font-size="13" fill="#c084fc" font-weight="bold">28%</text><rect x="40" y="230" width="268" height="9" rx="4.5" fill="#171333"/><rect x="40" y="230" width="75.0" height="9" rx="4.5" fill="#c084fc"><animate attributeName="width" from="0" to="75.0" dur="1.1s" begin="2s" fill="freeze"/></rect></g><g clip-path="url(#card)"><rect class="sh" x="0" y="0" width="100" height="282" fill="url(#shg)"/></g>
