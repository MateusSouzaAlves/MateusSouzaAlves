        <circle cx="210" cy="365" r="53" fill="url(#avatar)"/>
        <circle cx="210" cy="365" r="43" fill="#ffffff" fill-opacity="0.06" stroke="#c4b5fd" stroke-opacity="0.6"/>
        <text x="210" y="377" text-anchor="middle" fill="#ffffff" font-size="37" font-weight="850" letter-spacing="-1">MS</text>
        <circle class="pulse" cx="255" cy="405" r="8" fill="#3ddc84" stroke="#0b1026" stroke-width="4" filter="url(#glow)"/>
      </g>

      <text x="210" y="465" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="850" letter-spacing="0.4">MATEUS SOUZA</text>
      <text class="mono" x="210" y="491" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="800" letter-spacing="1.4">SOFTWARE ENGINEER</text>
      <text class="mono" x="210" y="513" text-anchor="middle" fill="#7dd3fc" font-size="9.5" letter-spacing="1">JAVA • BACKEND • ANDROID</text>

      <g transform="translate(66 537)" class="mono" font-size="8.2" font-weight="750">
        <g><rect width="64" height="27" rx="7" fill="#111b34" stroke="#334a72"/><text x="32" y="18" text-anchor="middle" fill="#e2e8f0">JAVA</text></g>
        <g transform="translate(72)"><rect width="64" height="27" rx="7" fill="#111b34" stroke="#334a72"/><text x="32" y="18" text-anchor="middle" fill="#e2e8f0">KOTLIN</text></g>
        <g transform="translate(144)"><rect width="64" height="27" rx="7" fill="#201638" stroke="#7c3aed"/><text x="32" y="18" text-anchor="middle" fill="#ddd6fe">SPRING</text></g>
        <g transform="translate(216)"><rect width="72" height="27" rx="7" fill="#0d2524" stroke="#3ddc84"/><text x="36" y="18" text-anchor="middle" fill="#86efac">ANDROID</text></g>
      </g>

      <g transform="translate(66 603)">
        <rect width="118" height="28" rx="5" fill="#0a0f21" stroke="#334155"/>
        <g fill="#cbd5e1">
          <rect x="10" y="7" width="2" height="14"/><rect x="15" y="7" width="4" height="14"/><rect x="22" y="7" width="2" height="14"/>
          <rect x="28" y="7" width="5" height="14"/><rect x="36" y="7" width="2" height="14"/><rect x="42" y="7" width="3" height="14"/>
          <rect x="49" y="7" width="5" height="14"/><rect x="57" y="7" width="2" height="14"/><rect x="63" y="7" width="4" height="14"/>
          <rect x="71" y="7" width="2" height="14"/><rect x="77" y="7" width="5" height="14"/><rect x="86" y="7" width="3" height="14"/>
          <rect x="93" y="7" width="2" height="14"/><rect x="99" y="7" width="6" height="14"/>
        </g>
        <circle class="pulse" cx="139" cy="9" r="4" fill="#3ddc84"/>
        <text class="mono" x="150" y="12" fill="#86efac" font-size="8.5" font-weight="800">READY TO BUILD</text>
        <text class="mono" x="288" y="27" text-anchor="end" fill="#64748b" font-size="7.5">ACCESS: PROFESSIONAL</text>
