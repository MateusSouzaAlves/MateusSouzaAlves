<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Credencial profissional de Mateus Souza</title>
  <desc id="desc">Crachá dark de software engineer suspenso por um cordão, com as iniciais MS, tecnologias Java, Kotlin, Spring e Android e status online.</desc>

  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d20"/>
      <stop offset="0.55" stop-color="#070b18"/>
      <stop offset="1" stop-color="#111032"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.52" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.52" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.48" stop-color="#64748b"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="backGlow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-25%" width="160%" height="165%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#020617" flood-opacity="0.62"/>
    </filter>
    <filter id="statusGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style><![CDATA[
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .swing { transform-box: view-box; transform-origin: 210px 8px; animation: swing 6s ease-in-out infinite; }
      .status { animation: statusPulse 3.8s ease-in-out infinite; }
      @keyframes swing {
        0%, 100% { transform: rotate(-1.15deg); }
        50% { transform: rotate(1.15deg); }
      }
      @keyframes statusPulse {
        0%, 100% { opacity: .62; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .swing, .status { animation: none !important; }
      }
    ]]></style>
  </defs>

  <ellipse cx="210" cy="410" rx="198" ry="194" fill="url(#backGlow)"/>

  <g class="swing">
    <path d="M132-18 195 151" fill="none" stroke="url(#strap)" stroke-width="26" stroke-linecap="round"/>
    <path d="M288-18 225 151" fill="none" stroke="url(#strap)" stroke-width="26" stroke-linecap="round"/>
    <path d="M139-15 201 148" fill="none" stroke="#c4b5fd" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="5 6"/>
    <path d="M281-15 219 148" fill="none" stroke="#c4b5fd" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="5 6"/>

    <g>
      <rect x="184" y="140" width="52" height="32" rx="7" fill="url(#metal)" stroke="#475569"/>
      <rect x="195" y="148" width="30" height="8" rx="4" fill="#334155"/>
      <circle cx="210" cy="184" r="15" fill="none" stroke="url(#metal)" stroke-width="6"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="48" y="205" width="324" height="386" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="49" y="206" width="322" height="48" rx="25" fill="#101631"/>
      <path d="M49 229a24 24 0 0 1 24-24h274a24 24 0 0 1 24 24v25H49Z" fill="#101631"/>
      <rect x="176" y="216" width="68" height="10" rx="5" fill="#030712" stroke="#334155"/>

      <text class="mono" x="70" y="243" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1.45">DEVELOPER ID</text>
      <text class="mono" x="350" y="243" text-anchor="end" fill="#a78bfa" font-size="9.5">MSA-JAVA-ANDROID</text>

      <circle cx="210" cy="323" r="62" fill="#080c1c" stroke="url(#edge)" stroke-width="3"/>
      <circle cx="210" cy="323" r="53" fill="url(#portrait)"/>
      <path d="M178 339V303l32 28 32-28v36" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
      <text x="210" y="336" text-anchor="middle" fill="#ffffff" font-size="37" font-weight="800" letter-spacing="-1">MS</text>
      <circle class="status" cx="253" cy="361" r="8" fill="#3ddc84" stroke="#080d20" stroke-width="4" filter="url(#statusGlow)"/>

      <text x="210" y="416" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="0.4">MATEUS SOUZA</text>
      <text class="mono" x="210" y="441" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1.25">SOFTWARE ENGINEER</text>
      <text class="mono" x="210" y="463" text-anchor="middle" fill="#7dd3fc" font-size="10.5" letter-spacing="0.8">JAVA • ANDROID • BACKEND</text>

      <line x1="75" y1="481" x2="345" y2="481" stroke="#334155"/>

      <g transform="translate(72 496)">
        <rect width="128" height="31" rx="8" fill="#0d1730" stroke="#334155"/>
        <text class="mono" x="64" y="20" text-anchor="middle" fill="#e2e8f0" font-size="10.5" font-weight="700">JAVA</text>
      </g>
      <g transform="translate(220 496)">
        <rect width="128" height="31" rx="8" fill="#0d1730" stroke="#334155"/>
        <text class="mono" x="64" y="20" text-anchor="middle" fill="#e2e8f0" font-size="10.5" font-weight="700">KOTLIN</text>
      </g>
      <g transform="translate(72 536)">
        <rect width="128" height="31" rx="8" fill="#0d1730" stroke="#334155"/>
        <text class="mono" x="64" y="20" text-anchor="middle" fill="#e2e8f0" font-size="10.5" font-weight="700">SPRING BOOT</text>
      </g>
      <g transform="translate(220 536)">
        <rect width="128" height="31" rx="8" fill="#0d1f25" stroke="#3ddc84" stroke-opacity="0.52"/>
        <text class="mono" x="64" y="20" text-anchor="middle" fill="#86efac" font-size="10.5" font-weight="700">ANDROID</text>
      </g>

      <circle class="status" cx="76" cy="579" r="4" fill="#3ddc84" filter="url(#statusGlow)"/>
      <text class="mono" x="88" y="583" fill="#86efac" font-size="9.5" font-weight="700">STATUS: READY TO BUILD</text>
      <text class="mono" x="348" y="583" text-anchor="end" fill="#64748b" font-size="8.5">MS / 2026</text>
    </g>
  </g>
</svg>
