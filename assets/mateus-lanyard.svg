      <rect x="44" y="229" width="332" height="421" rx="25" fill="url(#grid)"/>
      <path d="M44 300H376" stroke="#334155"/>
      <path d="M44 586H376" stroke="#334155"/>
      <rect class="scan" x="45" y="301" width="330" height="2" fill="#3ddc84"/>

      <text class="mono" x="66" y="261" fill="#94a3b8" font-size="9" font-weight="700" letter-spacing="1.5">DEVELOPER ID</text>
      <text class="mono" x="354" y="261" text-anchor="end" fill="#c4b5fd" font-size="8.5">MSA-2026-ANDROID</text>
      <rect x="171" y="246" width="78" height="11" rx="5.5" fill="#050816" stroke="#334155"/>
      <circle cx="181" cy="251.5" r="2.5" fill="#3ddc84"/>

