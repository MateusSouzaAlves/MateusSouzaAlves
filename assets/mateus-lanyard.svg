    <path d="M314 -22L236 205H209L272 -22Z" fill="url(#strap)"/>
    <path d="M129 -10L192 194" fill="none" stroke="url(#strapEdge)" stroke-width="3" opacity="0.7"/>
    <path d="M291 -10L228 194" fill="none" stroke="url(#strapEdge)" stroke-width="3" opacity="0.7"/>
    <g class="mono" font-size="7.5" fill="#ddd6fe" letter-spacing="1.5" opacity="0.75">
