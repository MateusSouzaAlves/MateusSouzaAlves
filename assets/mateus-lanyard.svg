    <rect x="187" y="173" width="46" height="12" rx="5" fill="#111827"/>
    <path d="M194 196v19c0 15 32 15 32 0v-19" fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="210" cy="220" r="14" fill="#0b1026" stroke="#cbd5e1" stroke-width="6"/>

    <g filter="url(#shadow)">
