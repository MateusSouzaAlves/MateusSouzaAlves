<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 680" width="420" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Credencial profissional de Mateus Souza</title>
  <desc id="desc">Crachá tecnológico azul e violeta com as iniciais MS, stack Java, Kotlin, Spring Boot e Android, identificação e status profissional.</desc>

  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#312e81"/><stop offset="0.46" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="strapEdge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#c084fc"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10142c"/><stop offset="0.55" stop-color="#0b1026"/><stop offset="1" stop-color="#16112d"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/><stop offset="0.45" stop-color="#7c3aed"/><stop offset="0.75" stop-color="#c084fc"/><stop offset="1" stop-color="#3ddc84"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4c1d95"/><stop offset="0.55" stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#475569"/><stop offset="0.25" stop-color="#cbd5e1"/><stop offset="0.5" stop-color="#64748b"/><stop offset="0.75" stop-color="#e2e8f0"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#a78bfa" stroke-opacity="0.055"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.55"/></filter>
    <style><![CDATA[
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .swing { transform-box: view-box; transform-origin: 210px 5px; animation: swing 7.4s ease-in-out infinite; }
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      .scan { animation: scan 7s ease-in-out infinite; }
      @keyframes swing { 0%,100% { transform: rotate(-1.25deg); } 50% { transform: rotate(1.25deg); } }
      @keyframes pulse { 0%,100% { opacity: .52; } 50% { opacity: 1; } }
      @keyframes scan { 0%,100% { transform: translateY(-10px); opacity: 0; } 18%,72% { opacity: .28; } 78% { transform: translateY(320px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .swing, .pulse, .scan { animation: none !important; } }
    ]]></style>
  </defs>

  <g class="swing">
