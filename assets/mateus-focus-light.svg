<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Foco técnico de Mateus Souza</title><desc id="desc">Card claro com áreas de foco em backend, Android, integrações, arquitetura e cloud.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0284c7"/><stop offset=".5" stop-color="#6d28d9"/><stop offset="1" stop-color="#16a34a"/></linearGradient><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#64748b" stroke-opacity=".065"/></pattern><style><![CDATA[text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}.flow{animation:flow 10s linear infinite}.pulse{animation:pulse 3.2s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}}]]></style></defs>
