<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Foco técnico de Mateus Souza</title><desc id="desc">Card escuro com áreas de foco em backend, Android, integrações, arquitetura e cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1026"/><stop offset="1" stop-color="#17112f"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#3ddc84"/></linearGradient><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
    <style><![CDATA[text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}.flow{animation:flow 10s linear infinite}.pulse{animation:pulse 3.2s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}}]]></style>
  </defs>
  <rect x="1" y="1" width="558" height="238" rx="20" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/><rect x="2" y="2" width="556" height="236" rx="19" fill="url(#grid)"/>
  <circle class="pulse" cx="28" cy="28" r="5" fill="#3ddc84"/><text class="mono" x="42" y="32" fill="#86efac" font-size="11" font-weight="800" letter-spacing="1.5">ENGINEERING FOCUS</text><text class="mono" x="532" y="32" text-anchor="end" fill="#64748b" font-size="9">SYSTEM MAP</text><line x1="24" y1="50" x2="536" y2="50" stroke="#334155"/>
  <g class="mono" font-size="10.5">
    <text x="26" y="85" fill="#cbd5e1">BACKEND / APIs</text><rect x="151" y="74" width="282" height="12" rx="6" fill="#111827"/><rect x="151" y="74" width="252" height="12" rx="6" fill="#7c3aed"/><text x="524" y="85" text-anchor="end" fill="#c4b5fd">CORE</text>
    <text x="26" y="120" fill="#cbd5e1">ANDROID / MOBILE</text><rect x="151" y="109" width="282" height="12" rx="6" fill="#111827"/><rect x="151" y="109" width="238" height="12" rx="6" fill="#3ddc84"/><text x="524" y="120" text-anchor="end" fill="#86efac">CORE</text>
    <text x="26" y="155" fill="#cbd5e1">SDK / INTEGRATIONS</text><rect x="151" y="144" width="282" height="12" rx="6" fill="#111827"/><rect x="151" y="144" width="214" height="12" rx="6" fill="#38bdf8"/><text x="524" y="155" text-anchor="end" fill="#7dd3fc">ACTIVE</text>
    <text x="26" y="190" fill="#cbd5e1">CLOUD / ARCH</text><rect x="151" y="179" width="282" height="12" rx="6" fill="#111827"/><rect x="151" y="179" width="180" height="12" rx="6" fill="#c084fc"/><text x="524" y="190" text-anchor="end" fill="#e9d5ff">EVOLVING</text>
  </g>
  <path class="flow" d="M224 213H433" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 8"/><circle class="pulse" cx="224" cy="213" r="4" fill="#3ddc84"/><circle cx="433" cy="213" r="4" fill="#38bdf8"/><text class="mono" x="26" y="217" fill="#64748b" font-size="8.5">LEARN → BUILD → CONNECT → SCALE</text>
</svg>
