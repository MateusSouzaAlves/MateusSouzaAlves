<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="title desc">
  <title id="title">GitHub snapshot de Mateus Souza</title>
  <desc id="desc">Card claro com 19 repositórios públicos, 142 seguidores, quatro projetos destacados e Java como linguagem principal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0284c7"/><stop offset="0.5" stop-color="#6d28d9"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#64748b" stroke-opacity="0.065"/></pattern>
    <style><![CDATA[text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}.pulse{animation:pulse 3s ease-in-out infinite}.lift{transform-box:fill-box;transform-origin:center;animation:lift 5.5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.pulse,.lift{animation:none!important}}]]></style>
  </defs>
  <rect x="1" y="1" width="558" height="238" rx="20" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/><rect x="2" y="2" width="556" height="236" rx="19" fill="url(#grid)"/>
  <circle class="pulse" cx="28" cy="28" r="5" fill="#16a34a"/><text class="mono" x="42" y="32" fill="#15803d" font-size="11" font-weight="800" letter-spacing="1.5">GITHUB SNAPSHOT</text><text class="mono" x="532" y="32" text-anchor="end" fill="#64748b" font-size="9">PUBLIC PROFILE</text><line x1="24" y1="50" x2="536" y2="50" stroke="#cbd5e1"/>
  <g class="lift" transform="translate(24 70)">
    <g><rect width="120" height="104" rx="14" fill="#f8fafc" stroke="#7dd3fc"/><text x="60" y="48" text-anchor="middle" fill="#0f172a" font-size="31" font-weight="850">19</text><text class="mono" x="60" y="75" text-anchor="middle" fill="#0369a1" font-size="9" font-weight="700">PUBLIC REPOS</text><rect x="24" y="88" width="72" height="3" rx="1.5" fill="#0284c7"/></g>
    <g transform="translate(130)"><rect width="120" height="104" rx="14" fill="#f5f3ff" stroke="#8b5cf6"/><text x="60" y="48" text-anchor="middle" fill="#0f172a" font-size="31" font-weight="850">142</text><text class="mono" x="60" y="75" text-anchor="middle" fill="#6d28d9" font-size="9" font-weight="700">FOLLOWERS</text><rect x="24" y="88" width="72" height="3" rx="1.5" fill="#7c3aed"/></g>
    <g transform="translate(260)"><rect width="120" height="104" rx="14" fill="#faf5ff" stroke="#c084fc"/><text x="60" y="48" text-anchor="middle" fill="#0f172a" font-size="31" font-weight="850">04</text><text class="mono" x="60" y="75" text-anchor="middle" fill="#7e22ce" font-size="9" font-weight="700">FEATURED</text><rect x="24" y="88" width="72" height="3" rx="1.5" fill="#9333ea"/></g>
    <g transform="translate(390)"><rect width="120" height="104" rx="14" fill="#f0fdf4" stroke="#22c55e"/><text x="60" y="48" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="850">JAVA</text><text class="mono" x="60" y="75" text-anchor="middle" fill="#15803d" font-size="9" font-weight="700">PRIMARY</text><rect x="24" y="88" width="72" height="3" rx="1.5" fill="#16a34a"/></g>
  </g>
  <text class="mono" x="24" y="213" fill="#64748b" font-size="9">PROFILE SIGNAL</text><circle class="pulse" cx="112" cy="210" r="3.5" fill="#16a34a"/><text class="mono" x="123" y="213" fill="#15803d" font-size="9">BUILDING • LEARNING • SHIPPING</text><text class="mono" x="536" y="213" text-anchor="end" fill="#64748b" font-size="8.5">SNAPSHOT / 2026</text>
</svg>
