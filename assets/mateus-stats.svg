<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="title desc">
  <title id="title">GitHub snapshot de Mateus Souza</title>
  <desc id="desc">Card escuro com 19 repositórios públicos, 142 seguidores, quatro projetos destacados e Java como linguagem principal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1026"/><stop offset="1" stop-color="#17112f"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#3ddc84"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; } .mono { font-family: Consolas, "Liberation Mono", monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; } .lift { transform-box: fill-box; transform-origin: center; animation: lift 5.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } } @keyframes lift { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
      @media (prefers-reduced-motion: reduce) { .pulse,.lift { animation:none!important } }
    ]]></style>
  </defs>
  <rect x="1" y="1" width="558" height="238" rx="20" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="2" y="2" width="556" height="236" rx="19" fill="url(#grid)"/>
  <circle class="pulse" cx="28" cy="28" r="5" fill="#3ddc84" filter="url(#glow)"/>
  <text class="mono" x="42" y="32" fill="#86efac" font-size="11" font-weight="800" letter-spacing="1.5">GITHUB SNAPSHOT</text>
  <text class="mono" x="532" y="32" text-anchor="end" fill="#64748b" font-size="9">PUBLIC PROFILE</text>
  <line x1="24" y1="50" x2="536" y2="50" stroke="#334155"/>
  <g class="lift" transform="translate(24 70)">
    <g><rect width="120" height="104" rx="14" fill="#10182e" stroke="#334a72"/><text x="60" y="48" text-anchor="middle" fill="#f8fafc" font-size="31" font-weight="850">19</text><text class="mono" x="60" y="75" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="700">PUBLIC REPOS</text><rect x="24" y="88" width="72" height="3" rx="1.5" fill="#38bdf8"/></g>
    <g transform="translate(130)"><rect width="120" height="104" rx="14" fill="#15132f" stroke="#6d28d9"/><text x="60" y="48" text-anchor="middle" fill="#f8fafc" font-size="31" font-weight="850">142</text><text class="mono" x="60" y="75" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="700">FOLLOWERS</text><rect x="24" y="88" width="72" height="3" rx="1.5" fill="#8b5cf6"/></g>
    <g transform="translate(260)"><rect width="120" height="104" rx="14" fill="#15132f" stroke="#a855f7"/><text x="60" y="48" text-anchor="middle" fill="#f8fafc" font-size="31" font-weight="850">04</text><text class="mono" x="60" y="75" text-anchor="middle" fill="#e9d5ff" font-size="9" font-weight="700">FEATURED</text><rect x="24" y="88" width="72" height="3" rx="1.5" fill="#c084fc"/></g>
    <g transform="translate(390)"><rect width="120" height="104" rx="14" fill="#0d2524" stroke="#3ddc84"/><text x="60" y="48" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="850">JAVA</text><text class="mono" x="60" y="75" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">PRIMARY</text><rect x="24" y="88" width="72" height="3" rx="1.5" fill="#3ddc84"/></g>
  </g>
  <text class="mono" x="24" y="213" fill="#64748b" font-size="9">PROFILE SIGNAL</text><circle class="pulse" cx="112" cy="210" r="3.5" fill="#3ddc84"/><text class="mono" x="123" y="213" fill="#86efac" font-size="9">BUILDING • LEARNING • SHIPPING</text>
  <text class="mono" x="536" y="213" text-anchor="end" fill="#64748b" font-size="8.5">SNAPSHOT / 2026</text>
</svg>
