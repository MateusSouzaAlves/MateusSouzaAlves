<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 232" width="500" height="232" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Stats de Mateus Souza</title><desc id="desc">Estatísticas públicas: 36 estrelas, 19 repositórios, 142 seguidores, 5 forks e 4 projetos destacados.</desc>
  <defs><style><![CDATA[text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}@keyframes fadeSlide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes rankPulse{0%,100%{opacity:.82}50%{opacity:1}}@keyframes shineX{0%{transform:translateX(-160px) skewX(-15deg)}60%,100%{transform:translateX(560px) skewX(-15deg)}}.row{opacity:0;animation:fadeSlide .5s ease forwards}.rk{animation:rankPulse 2.4s ease-in-out infinite}.sh{animation:shineX 4.5s ease-in-out 2.4s infinite}@media(prefers-reduced-motion:reduce){.row,.rk,.sh{animation:none!important;opacity:1}}]]></style><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#3ddc84"/></linearGradient><linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3ddc84"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cc"><rect x="1" y="1" width="498" height="230" rx="14"/></clipPath><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
