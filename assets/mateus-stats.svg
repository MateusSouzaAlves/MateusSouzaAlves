  <g class="row" style="animation-delay:.72s"><text x="24" y="105" font-size="14">📦</text><text x="52" y="105" font-size="13.5" fill="#cbd5e1">Public Repositories:</text><text x="316" y="105" text-anchor="end" font-size="14" font-weight="bold" fill="#3ddc84">19</text></g>
  <g class="row" style="animation-delay:.94s"><text x="24" y="136" font-size="14">👥</text><text x="52" y="136" font-size="13.5" fill="#cbd5e1">Followers:</text><text x="316" y="136" text-anchor="end" font-size="14" font-weight="bold" fill="#c084fc">142</text></g>
